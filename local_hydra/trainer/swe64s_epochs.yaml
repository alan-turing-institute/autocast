# Full-data epoch policy for matched SWE64 forecasting ablations.
defaults:
  - default
  - _self_

max_epochs: 512
max_steps: -1
max_time: "00:23:30:00"  # Safety cap, not the LR horizon.
num_sanity_val_steps: 2
accumulate_grad_batches: 1
limit_train_batches: 1.0
limit_val_batches: 1.0
check_val_every_n_epoch: 1
val_check_interval: 1.0

callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    auto_insert_metric_name: false
    every_n_epochs: 64
    save_on_train_epoch_end: false
    filename: snapshot-{epoch:04d}-{step:08d}
    save_last: true
    save_top_k: -1
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    auto_insert_metric_name: false
    every_n_epochs: 1
    save_on_train_epoch_end: false
    filename: best-val-{epoch:04d}-{step:08d}-{val_loss:.6f}
    mode: min
    monitor: val_loss
    save_last: false
    save_top_k: 1
  - _target_: autocast.callbacks.grad_norm.GradNormCallback
    norm_type: 2.0
    log_per_param: false
  - _target_: autocast.callbacks.metrics.ValidationMetricPlotCallback
    dirname: validation_metrics
    filename: validation_metrics.png
    log_to_logger: true
    max_cols: 3
    metric_prefixes: [val_, train_, grad_, lr]
    plot_metric_objects: true
    save_local: true
  - _target_: autocast.callbacks.ema.EMACallback
    decay: 0.999
