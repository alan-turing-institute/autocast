# @package _global_
defaults:
  - /local_experiment/swe64s/crps_fft_spatial1d_residual_one_output_12block_256ep_8h
  - _self_

experiment_name: swe64s_crps_fft_anomaly_spatial1d_residual_one_output_12block_256ep_8h

model:
  loss_func:
    # Retain both baseline terms. Training-only calibration: eight batches of
    # 32 windows, eight members, seed 153164; <=10% output-gradient RMS ratio.
    # Fixed for this benchmark; not a guarantee during subsequent training.
    weights: [1.0, 0.1, 0.12492216134130599]
    losses:
      - _target_: autocast.losses.AlphaFairCRPSLoss
        alpha: 0.95
      - _target_: autocast.losses.TransformedLoss
        requires_ambient_predictions: true
        decomposition:
          _target_: autocast.losses.FourierDecomposition
          representation: complex
          norm: ortho
        score:
          _target_: autocast.losses.CoefficientCRPSLoss
          alpha: 0.95
      - _target_: autocast.losses.SpectralSpreadErrorLoss
        # k edges [6, 14, 22, sqrt(2)*32] divided by grid size 64.
        # DC is separate; the last band includes all diagonal Nyquist modes.
        edges: [0.09375, 0.21875, 0.34375, 0.7071067811865476]
        include_dc: true
        power_scale: 1.0

hydra:
  launcher:
    timeout_min: 480
