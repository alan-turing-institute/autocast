# @package _global_
defaults:
  - /local_experiment/swe64s/afcrps_global_residual_small_2h30
  - _self_

experiment_name: swe64s_afcrps_spatial_residual_small_2h30

model:
  processor:
    # Match the global residual fit except for the allocation of latent noise.
    # 256 patch tokens x 4 IID values = 1024 random scalars per member.
    # Keep the inherited 1024-wide modulation; its shared projection adds 5120 params.
    noise_mode: spatial
    n_noise_input_channels: 4
