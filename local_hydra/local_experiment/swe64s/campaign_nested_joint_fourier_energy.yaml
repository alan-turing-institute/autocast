# @package _global_
defaults:
  - /local_experiment/swe64s/campaign_nested_afcrps
  - /loss/ensemble_fourier_crps@model.validation_loss_func
  - _self_

experiment_name: swe64s_campaign_nested_joint_fourier_energy

joint_fourier_score:
  _target_: autocast.losses.JointCoefficientEnergyScore
  alpha: ${model.validation_loss_func.losses.1.score.alpha}
  # Decoded h is already standardized. Both winds use the RMS training scale.
  channel_multipliers: [1.0, 0.9987621223, 1.0012363472]

model:
  loss_func:
    # Retain the parent's grid loss, spectral weight and FFT conventions.
    _target_: autocast.losses.WeightedSumLoss
    weights: ${model.validation_loss_func.weights}
    losses:
      - ${model.validation_loss_func.losses.0}
      - _target_: autocast.losses.TransformedLoss
        requires_ambient_predictions: true
        decomposition: ${model.validation_loss_func.losses.1.decomposition}
        score: ${joint_fourier_score}
