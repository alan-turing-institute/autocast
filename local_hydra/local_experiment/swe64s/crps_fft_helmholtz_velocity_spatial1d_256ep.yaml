# @package _global_
defaults:
  - /local_experiment/swe64s/crps_fft_joint_velocity_spatial1d_256ep
  - _self_

experiment_name: swe64s_crps_fft_helmholtz_velocity_spatial1d_256ep

# Hydra cannot merge an individual list element: copy the two unchanged base
# terms explicitly. Only the auxiliary mode differs from the joint control.
model:
  loss_func:
    losses:
      - _target_: autocast.losses.AlphaFairCRPSLoss
        alpha: 0.95
      - _target_: autocast.losses.TransformedLoss
        requires_ambient_predictions: true
        decomposition:
          _target_: autocast.losses.FourierDecomposition
          representation: complex
          norm: ortho
        score:
          _target_: autocast.losses.CoefficientCRPSLoss
          alpha: 0.95
      - _target_: autocast.losses.VelocityScoreLoss
        mode: helmholtz
        channels: [1, 2]
        channel_stds: [0.1211, 0.1214]
        velocity_scale: null
        domain_lengths: [6.283185307179586, 6.283185307179586]
        alpha: 0.95

hydra:
  launcher:
    timeout_min: 480
