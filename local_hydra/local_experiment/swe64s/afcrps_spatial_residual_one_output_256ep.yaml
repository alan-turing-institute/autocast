# @package _global_
defaults:
  - /local_experiment/swe64s/afcrps_global_residual_one_output_256ep
  - _self_

experiment_name: swe64s_afcrps_spatial_residual_one_output_256ep

model:
  processor:
    # Match the one-output cosine control except for the allocation of noise.
    # 256 patch tokens x 4 IID values = 1024 random scalars per member.
    # Keep 1024-wide modulation; the shared 4 -> 1024 projection adds 5120 params.
    noise_mode: spatial
    n_noise_input_channels: 4
