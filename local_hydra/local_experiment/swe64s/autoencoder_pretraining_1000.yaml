# @package _global_
defaults:
  - /local_experiment/swe64s/autoencoder_diversity_400_fresh
  - _self_

experiment_name: swe64s_autoencoder_pretraining_1000

# Supply the full 1000 x 321 pool assembled by prepare_ae_pretraining.py.
# Reuse the original validation/test trajectories and normalization.
# The inherited path is required; no dataset is selected implicitly.
ae_diversity_data_path: ???

trainer:
  # Inherit the fresh seed, model, PSGD, EMA and historical LR callback.
  # Each epoch takes a fresh shuffled prefix of the full pool: 1004 updates
  # x 4 GPUs x 16 states = 64,256 states, approximately 20% of 321,000.
  # Keep every frame available; do not build a fixed temporal subset.
  limit_train_batches: 1004
  max_epochs: 512
  max_steps: 514048  # 512 sampled epochs x 1004 updates.
  max_time: "00:23:30:00"  # Safety cap only; request 24h from Slurm.
