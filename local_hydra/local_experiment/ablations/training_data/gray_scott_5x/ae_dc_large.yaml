# @package _global_
defaults:
  - /local_experiment/ae/gray_scott/ae_dc_large
  - override /datamodule: gray_scott_5x
  - _self_

experiment_name: ablation_training_data_gs5x_ae_dc_large
seed: 42

optimizer:
  cosine_epochs: ${trainer.max_epochs}

output:
  skip_test: true

trainer:
  # A fresh shuffled fifth of all training batches per sampling epoch.
  # 512 sampling epochs are approximately 102.4 passes over the full 5x set.
  limit_train_batches: 0.2
  # The datamodule already thins validation windows across all 120 trajectories.
  limit_val_batches: 1.0
  max_epochs: 512
  max_time: "01:00:00:00"
  # Preserve the original AE callback stack, without later CRPS/EMA callbacks.
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      auto_insert_metric_name: false
      every_n_epochs: 5
      filename: latest-5ep-{epoch:04d}
      save_on_train_epoch_end: true
      save_top_k: 1
      save_last: true
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      auto_insert_metric_name: false
      filename: best-val-{epoch:04d}-{val_loss:.4f}
      mode: min
      monitor: val_loss
      save_top_k: 1
