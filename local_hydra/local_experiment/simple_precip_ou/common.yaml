# @package _global_
defaults:
  - override /encoder@model.encoder: permute_concat
  - override /decoder@model.decoder: channels_last
  - override /processor@model.processor: vit_azula_large
  - override /input_noise_injector@model.input_noise_injector: concat
  - override /optimizer: adamw_half
  - override /hydra/launcher: slurm
  - _self_

seed: 42
umask: "0007"
float32_matmul_precision: high
compile_backbone: false

datamodule:
  data_path: ${oc.env:AUTOCAST_DATASETS,./datasets}/simple_precip_ou_broad_front_64_train1000_b22babd
  normalization_path: ${.data_path}/stats.yml
  # Use accumulation and rain. The archived phi and envelope support redraws.
  channel_idxs: [0, 1]
  use_normalization: true
  batch_size: 32
  n_steps_input: 1
  n_steps_output: 1
  stride: 1
  valid_trajectories: 20  # Use the same first 20 stored validation cases in every fit.
  test_trajectories: 100

model:
  train_in_latent_space: false
  residual_prediction: true
  residual_use_delta_stats: true
  n_members: 8
  input_noise_injector:
    n_channels: 4
    std: 1.0
  processor:
    hidden_dim: 224
    n_layers: 12
    num_heads: 8
    patch_size: 4
    include_global_cond: false
    n_noise_channels: null
    n_noise_input_channels: null
    dropout: 0.0
    ffn_factor: 4
    qk_norm: true
    rope: false
    rpb: true
  loss_func:
    _target_: autocast.losses.AlphaFairCRPSLoss
    alpha: 0.95
  # Select checkpoints by grid afCRPS over the fields predicted by each run.
  validation_loss_func:
    _target_: autocast.losses.AlphaFairCRPSLoss
    alpha: 0.95

optimizer:
  learning_rate: 2e-4
  scheduler_interval: step
  cosine_epochs: null
  cosine_steps: 128000
  min_lr_ratio: 0.0

trainer:
  max_steps: 128000
  max_epochs: 1000000
  max_time: "00:11:45:00"
  limit_train_batches: 1.0
  check_val_every_n_epoch: null
  # Match the SWE64 sustained-rise cadence at one update per batch.
  val_check_interval: 500
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      auto_insert_metric_name: false
      every_n_epochs: 0
      every_n_train_steps: 32000
      save_on_train_epoch_end: false
      filename: snapshot-{step:08d}
      save_last: false
      save_top_k: -1
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      auto_insert_metric_name: false
      every_n_epochs: 1
      save_on_train_epoch_end: false
      filename: best-val-{epoch:04d}-{step:08d}-{val_loss:.6f}
      mode: min
      monitor: val_loss
      save_last: true
      save_top_k: 1
    - _target_: autocast.callbacks.grad_norm.GradNormCallback
      norm_type: 2.0
      log_per_param: false
    - _target_: autocast.callbacks.ema.EMACallback
      decay: 0.999
    - _target_: autocast.callbacks.sustained_validation.SustainedValidationRise
      monitor: val_loss
      relative_tolerance: 0.01
      absolute_tolerance: 1e-8
      patience: 10
      min_steps: 10000

logging:
  wandb:
    enabled: true
    mode: online
    group: simple-precip-ou-64
    log_model: false

output:
  skip_test: true
  save_config: true

hydra:
  launcher:
    timeout_min: 720
