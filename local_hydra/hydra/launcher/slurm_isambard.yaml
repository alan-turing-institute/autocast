# @package hydra.launcher
# Opt in with hydra/launcher=slurm_isambard. Resources remain overridable.
timeout_min: 240
gpus_per_node: 1
tasks_per_node: 1
additional_parameters:
  mem: 115G

# Load the site's OFI plugin and Slingshot settings before starting workers.
# NCCL_NET="AWS Libfabric" makes a missing plugin fail instead of using sockets.
setup:
  - module load brics/nccl/2.26.6-1
