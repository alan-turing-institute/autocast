defaults:
  - /backbone@backbone: vit_small
  - _self_

_target_: autocast.processors.drifting.DriftingProcessor
n_steps_output: auto
n_channels_out: auto
n_samples: 8
tau_list: [0.02, 0.05, 0.2]
diag_mask_value: 100.0

# Drifting is one-step: the backbone must not register a time embedding.
backbone:
  include_time_embedding: false
