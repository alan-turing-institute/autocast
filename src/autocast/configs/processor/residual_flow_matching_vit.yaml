defaults:
  - flow_matching_vit
  - /flow_source@source: iid_gaussian
  - _self_

_target_: autocast.processors.residual_flow_matching.ResidualFlowMatchingProcessor
integrator: euler

# IID residual noise plus this reference corresponds to a noisy persistence
# source in full-state coordinates. For a pretrained ProcessorReference, see
# residual_flow_matching_pretrained_vit and the processor walkthrough.
reference:
  _target_: autocast.processors.residual_reference.LastFrameReference
  n_steps_output: auto
  channel_indices: null

residual_normalizer:
  _target_: autocast.processors.residual_normalization.ResidualNormalizer
  n_steps_output: auto
  n_channels: auto
  granularity: lead_channel
