defaults:
  - /backbone@backbone: unet
  - _self_

_target_: autocast.processors.drifting.DriftingProcessor
n_steps_output: auto
n_channels_out: auto
n_samples: 8
tau_list: [0.02, 0.05, 0.2]
diag_mask_value: 100.0

# Lambda-conditioning. A single model is trained
# across a range of lambda, fed the bounded weight w=1/(1+lambda) through the
# backbone's loss-weight embedding, so lambda can be swept at inference on one
# model. energy_score_a_f sets the almost-fair coefficient of the ES term.
energy_score_a_f: 0.95
condition_on_lambda: true
lambda_log_min: 0.1
lambda_log_max: 30.0
lambda_zero_prob: 0.1
# Responsiveness forcing penalty. 0.0 = off; raise if the model
# becomes lambda-insensitive (verify on the bite-test before enabling).
forcing_eta: 0.0
forcing_margin: 0.0

# One-step generator conditioned on the loss weight: no time embedding, but the
# loss-weight embedding IS registered.
backbone:
  include_time_embedding: false
  include_loss_weight: true
