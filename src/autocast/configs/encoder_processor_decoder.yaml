defaults:
  - datamodule: autosim
  - optional simulator: null
  - optimizer: adamw
  - model: encoder_processor_decoder
  - trainer: default
  - logging: wandb
  - optional eval: encoder_processor_decoder
  - _self_
  - optional experiment: null
  - optional local_experiment: null
  - optional loss@model.loss_func: null

seed: 42
# Validation-plateau stop, OFF by default; switch it on per run with
# `early_stopping.enabled: true` (patience 100 epochs, min_delta 0; the checkpoint
# callbacks keep the best epoch). Patience 100 keeps the best checkpoint of CRPS and
# ARFC runs on AD64, CNS64, GS64 and GPE64 and of 248 earlier runs. Flow matching's
# val_loss is drawn afresh at every validation (noise and flow time), and patience
# 100 stops those runs at epochs 485-644 of ~3,000 with a checkpoint 2.4-22x worse
# than the best (aiphys#246), so the stop is not on by default.
early_stopping:
  enabled: false
  monitor: val_loss
  mode: min
  patience: 100
  min_delta: 0.0
experiment_name: epd
autoencoder_checkpoint: null
umask: "0002"

# torch.set_float32_matmul_precision: one of {highest, high, medium} or null.
# - null (default): leave PyTorch default ("highest", pure f32 matmul).
# - "high": TF32 matmul with f32 accumulate (~2-3x throughput on Ampere+, safer
#   than bf16-mixed since accumulation stays f32).
# - "medium": TF32 matmul + TF32 accumulate (faster still, less safe).
float32_matmul_precision: null

train_eval:
  checkpoint: null
  eval_subdir: eval
  video_dir: null
  batch_indices: null
  eval_overrides: []

output:
  checkpoint_name: encoder_processor_decoder.ckpt
  checkpoint_path: null  # Override checkpoint path (defaults to work_dir/checkpoint_name)
  save_config: true
  skip_test: false  # Skip running trainer.test() after training

hydra:
  searchpath:
    - file://${oc.env:PWD,.}/local_hydra
  run:
    dir: outputs/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: true
