defaults:
  - datamodule: miniwell
  - optional simulator: null
  - optimizer: adamw
  - model: processor
  - trainer: default
  - logging: wandb
  - optional eval: processor
  - _self_
  - optional experiment: null
  - optional local_experiment: null

seed: 42
# Validation-plateau stop, ON by default (owner ruling 2026-10-04, D205): patience 100,
# min_delta 0; the checkpoint callbacks keep the best epoch. Replayed on 248 finished
# runs, patience 100 never kept a checkpoint more than 1% off the run's own best (50
# did twice). A run that must train its full budget (matched-budget grids, drifting,
# memorisation probes) sets `early_stopping.enabled: false` in its preset, with why.
early_stopping:
  enabled: true
  monitor: val_loss
  mode: min
  patience: 100
  min_delta: 0.0
experiment_name: processor

# torch.set_float32_matmul_precision: one of {highest, high, medium} or null.
# See encoder_processor_decoder.yaml for details.
float32_matmul_precision: null

output:
  checkpoint_name: processor.ckpt
  checkpoint_path: null  # Override checkpoint path (defaults to work_dir/checkpoint_name)
  save_config: true
  skip_test: false  # Skip running trainer.test() after training


hydra:
  searchpath:
    - file://${oc.env:PWD,.}/local_hydra
  run:
    dir: outputs/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: true
