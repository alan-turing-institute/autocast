# @package _global_
defaults:
  - override /datamodule: shallow_water2d_crps_32
  - override /trainer: crps_no_ema
  - override /encoder@model.encoder: permute_concat
  - override /decoder@model.decoder: channels_last
  - override /processor@model.processor: vit
  - override /input_noise_injector@model.input_noise_injector: concat
  - _self_

experiment_name: epd_crps_vit_concat_residual_32

optimizer:
  learning_rate: 1.0e-3

model:
  train_in_latent_space: false
  residual_prediction: true
  residual_use_delta_stats: true
  n_members: 4
  loss_func:
    _target_: autocast.losses.ensemble.CRPSLoss
  encoder:
    with_constants: false
  input_noise_injector:
    n_channels: 1
    std: 1.0
  processor:
    spatial_resolution: [32, 32]
    hidden_dim: 64
    num_heads: 4
    n_layers: 4
    n_noise_channels: null
    patch_size: 1
    zero_init_output: true

trainer:
  max_epochs: 50
  max_steps: 1024
  limit_val_batches: 4
  num_sanity_val_steps: 0
  log_every_n_steps: 32
