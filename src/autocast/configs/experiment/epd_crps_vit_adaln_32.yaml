# @package _global_
defaults:
  - override /datamodule: shallow_water2d_crps_32
  - override /trainer: crps_no_ema
  - override /encoder@model.encoder: permute_concat
  - override /decoder@model.decoder: channels_last
  - override /processor@model.processor: vit
  - _self_

experiment_name: epd_crps_vit_adaln_32

optimizer:
  learning_rate: 1.0e-3

model:
  train_in_latent_space: false
  # Match the local-noise pilot: train with four members, then evaluate with 64.
  n_members: 4
  loss_func:
    _target_: autocast.losses.ensemble.CRPSLoss
  encoder:
    with_constants: false
  processor:
    spatial_resolution: [32, 32]
    hidden_dim: 64
    num_heads: 4
    n_layers: 4
    # One global latent vector is sampled per ensemble member and shared by
    # every spatial location through conditional LayerNorm.
    n_noise_channels: 16
    patch_size: 1

trainer:
  max_epochs: 50
  max_steps: 1024
  limit_val_batches: 4
  num_sanity_val_steps: 0
  log_every_n_steps: 32
