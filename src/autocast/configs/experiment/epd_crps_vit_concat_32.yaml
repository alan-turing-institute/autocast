# @package _global_
defaults:
  - override /datamodule: shallow_water2d_crps_32
  - override /encoder@model.encoder: permute_concat
  - override /decoder@model.decoder: channels_last
  - override /processor@model.processor: vit
  - override /input_noise_injector@model.input_noise_injector: concat
  - _self_

experiment_name: epd_crps_vit_concat_32

optimizer:
  learning_rate: 1.0e-3

model:
  train_in_latent_space: false
  n_members: 8
  loss_func:
    _target_: autocast.losses.ensemble.CRPSLoss
  train_metrics:
    crps:
      _target_: autocast.metrics.ensemble.CRPS
    crps_mae_term:
      _target_: autocast.metrics.ensemble.CRPSMAETerm
    crps_spread_term:
      _target_: autocast.metrics.ensemble.CRPSSpreadTerm
  val_metrics:
    crps:
      _target_: autocast.metrics.ensemble.CRPS
    crps_mae_term:
      _target_: autocast.metrics.ensemble.CRPSMAETerm
    crps_spread_term:
      _target_: autocast.metrics.ensemble.CRPSSpreadTerm
    spread:
      _target_: autocast.metrics.ensemble.EnsembleSpread
    multicoverage:
      _target_: autocast.metrics.MultiCoverage
    multiwinkler:
      _target_: autocast.metrics.ensemble.MultiWinkler
  encoder:
    with_constants: false
  input_noise_injector:
    n_channels: 1
    std: 1.0
  processor:
    spatial_resolution: [32, 32]
    hidden_dim: 128
    num_heads: 4
    n_layers: 4
    n_noise_channels: null
    patch_size: 1

trainer:
  max_epochs: 50
