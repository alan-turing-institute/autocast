_target_: lightning.pytorch.trainer.trainer.Trainer
max_time: "00:12:00:00"
accelerator: auto
strategy: auto
num_nodes: 1
devices: 1
log_every_n_steps: 10
enable_checkpointing: true
detect_anomaly: false
default_root_dir: null
gradient_clip_val: null

# Preserve the callback stack used by the April 2026 main-comparison FM runs.
# The submission script overrides every_n_epochs with a dataset-specific
# quarter-schedule cadence.
callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    save_top_k: 1
    every_n_epochs: 5
    save_on_train_epoch_end: true
    save_last: true
    filename: "latest-5ep-{epoch:04d}"
    auto_insert_metric_name: false
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: false
    filename: "best-val-{epoch:04d}-{val_loss:.4f}"
    auto_insert_metric_name: false
  - _target_: autocast.callbacks.ema.EMACallback
    decay: 0.999
